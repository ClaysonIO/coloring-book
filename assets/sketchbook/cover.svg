<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3D3"/>
      <stop offset="0.55" stop-color="#FFC6B0"/>
      <stop offset="1" stop-color="#F59E9E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F1E9"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D9A8"/>
      <stop offset="1" stop-color="#E2B077"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#F0A500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7A3B2E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <g fill="#FFFFFF" opacity="0.45">
    <circle cx="120" cy="140" r="10"/><circle cx="780" cy="110" r="7"/><circle cx="820" cy="1080" r="12"/>
    <circle cx="90" cy="1040" r="6"/><circle cx="700" cy="230" r="4"/><circle cx="170" cy="300" r="5"/>
  </g>
  <!-- notebook -->
  <g transform="rotate(-6 450 600)" filter="url(#shadow)">
    <rect x="170" y="210" width="560" height="760" rx="28" fill="#5C6BC0"/>
    <rect x="196" y="226" width="520" height="728" rx="18" fill="url(#paper)"/>
    <g stroke="#B3D4F5" stroke-width="4">
      <line x1="230" y1="360" x2="690" y2="360"/><line x1="230" y1="420" x2="690" y2="420"/>
      <line x1="230" y1="480" x2="690" y2="480"/><line x1="230" y1="540" x2="690" y2="540"/>
      <line x1="230" y1="600" x2="690" y2="600"/><line x1="230" y1="660" x2="690" y2="660"/>
      <line x1="230" y1="720" x2="690" y2="720"/><line x1="230" y1="780" x2="690" y2="780"/>
      <line x1="230" y1="840" x2="690" y2="840"/><line x1="230" y1="900" x2="690" y2="900"/>
    </g>
    <line x1="290" y1="250" x2="290" y2="935" stroke="#F4A7A7" stroke-width="4"/>
    <!-- spiral -->
    <g fill="none" stroke="#9AA3B5" stroke-width="10" stroke-linecap="round">
      <path d="M220 270 q-50 0 -50 24 q0 24 50 24"/><path d="M220 350 q-50 0 -50 24 q0 24 50 24"/>
      <path d="M220 430 q-50 0 -50 24 q0 24 50 24"/><path d="M220 510 q-50 0 -50 24 q0 24 50 24"/>
      <path d="M220 590 q-50 0 -50 24 q0 24 50 24"/><path d="M220 670 q-50 0 -50 24 q0 24 50 24"/>
      <path d="M220 750 q-50 0 -50 24 q0 24 50 24"/><path d="M220 830 q-50 0 -50 24 q0 24 50 24"/>
      <path d="M220 910 q-50 0 -50 24 q0 24 50 24"/>
    </g>
  </g>
  <!-- pencil -->
  <g transform="translate(610 690) rotate(-38)" filter="url(#shadow)">
    <rect x="-40" y="-330" width="80" height="460" rx="6" fill="url(#body)"/>
    <rect x="-40" y="-330" width="26" height="460" fill="#FFE082" opacity="0.6"/>
    <rect x="14" y="-330" width="26" height="460" fill="#E69500" opacity="0.35"/>
    <rect x="-42" y="-392" width="84" height="66" rx="8" fill="#BDBDBD"/>
    <rect x="-42" y="-380" width="84" height="10" fill="#9E9E9E"/>
    <rect x="-42" y="-354" width="84" height="10" fill="#9E9E9E"/>
    <rect x="-40" y="-452" width="80" height="66" rx="20" fill="#F48FB1"/>
    <path d="M-40 130 L0 250 L40 130 Z" fill="url(#wood)"/>
    <path d="M-13 211 L0 250 L13 211 Z" fill="#37474F"/>
  </g>
</svg>
