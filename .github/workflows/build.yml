name: Build

# Builds run only for pushes to main (i.e. merged PRs) and for pull requests, and only when something
# that goes into the app changed. Website changes (docs/, BookPacks/ and their scripts), README and
# store-listing edits don't build or release anything; the Website workflow handles the site.
# Pushes to main also publish the Android APK as a GitHub release.
# Keep both lists in sync, and add any new folder the app is built from.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'ColoringPages/**'
      - 'scripts/build-content.mjs'
      - 'scripts/content-lib.mjs'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'ColoringPages/**'
      - 'scripts/build-content.mjs'
      - 'scripts/content-lib.mjs'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Don't cancel main builds, or a quick second merge would skip a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck
    # Manual runs are only allowed on main, so other branches never build.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  android:
    name: Android APK
    # Runs alongside the typecheck (the release job waits for both) so it starts right away.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Caches the C++ compiled by CMake (app, Reanimated, Worklets, Skia glue), which
      # Gradle's own cache doesn't cover. CMake picks the launcher up from the environment.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache
          max-size: 2G
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        # Signs with the release keystore when the ANDROID_KEYSTORE_* secrets are set (see README), passed
        # to Gradle as the same signing properties Android Studio uses. Without them (or on pull requests
        # from forks, which get no secrets) Expo's template signs with the debug keystore, so the APK still
        # installs directly.
        # Only phone/tablet CPUs are built (x86 and x86_64 are emulator-only), roughly halving the
        # native compile; armeabi-v7a stays for 32-bit devices such as Amazon Fire tablets.
        # The extra JVM memory stops the Gradle daemon running out of metaspace mid-build.
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            signing=(
              "-Pandroid.injected.signing.store.file=$keystore"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            )
            echo "Signing with the release keystore."
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set; signing with the debug keystore."
          fi
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            "${signing[@]}"
      - name: Check APK signature
        # Fails if the release keystore was supplied but the APK still carries the debug certificate.
        env:
          RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/*.apk)
          echo "$certs"
          if [ "$RELEASE_SIGNING" = true ] && grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::The release keystore was set but the APK is signed with the debug key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coloring-book-android
          path: android/app/build/outputs/apk/release/*.apk

  release:
    name: Android release
    needs: [check, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coloring-book-android
          path: apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .expo.version app.json)
          tag="v${version}-build.${{ github.run_number }}"
          mv apk/*.apk "coloring-book-${tag}.apk"
          gh release create "$tag" "coloring-book-${tag}.apk" \
            --target "$GITHUB_SHA" \
            --title "Coloring Book ${tag}" \
            --generate-notes

  ios:
    name: iOS simulator build
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate native project and install pods
        run: npx expo prebuild --platform ios
      - name: Build for simulator (unsigned)
        run: |
          xcodebuild \
            -workspace ios/ColoringBook.xcworkspace \
            -scheme ColoringBook \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip app
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/ColoringBook-simulator.zip" ColoringBook.app
      - uses: actions/upload-artifact@v4
        with:
          name: coloring-book-ios-simulator
          path: ColoringBook-simulator.zip
