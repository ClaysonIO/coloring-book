name: Build

# Builds run only for pushes to main (i.e. merged PRs) and for pull requests.
# Pushes to main also publish the Android APK as a GitHub release.
on:
  push:
    branches: [main]
    # Website-only changes don't need a new build or release.
    paths-ignore: ['docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Don't cancel main builds, or a quick second merge would skip a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck
    # Manual runs are only allowed on main, so other branches never build.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        # Expo's template signs release builds with the debug keystore, so the APK installs directly.
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: coloring-book-android
          path: android/app/build/outputs/apk/release/*.apk

  release:
    name: Android release
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coloring-book-android
          path: apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .expo.version app.json)
          tag="v${version}-build.${{ github.run_number }}"
          mv apk/*.apk "coloring-book-${tag}.apk"
          gh release create "$tag" "coloring-book-${tag}.apk" \
            --target "$GITHUB_SHA" \
            --title "Coloring Book ${tag}" \
            --generate-notes

  ios:
    name: iOS simulator build
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate native project and install pods
        run: npx expo prebuild --platform ios
      - name: Build for simulator (unsigned)
        run: |
          xcodebuild \
            -workspace ios/ColoringBook.xcworkspace \
            -scheme ColoringBook \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip app
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/ColoringBook-simulator.zip" ColoringBook.app
      - uses: actions/upload-artifact@v4
        with:
          name: coloring-book-ios-simulator
          path: ColoringBook-simulator.zip
